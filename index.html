<!DOCTYPE html>
<html>
	<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>0:00</title>
    <link rel="stylesheet" href="style.css">
	</head>
	<body class="fade">
		<div id="red-overlay"></div>
		<div id="skew-wrapper">
    	<img class="expand" id="gif"src="https://i.giphy.com/media/3oFyDpRagf96Uz9rzO/giphy.webp"/>
	    <main>
				<h1>Procrastination has gone too far! This is not a joke, this is a call for help!</h1>
	      	<h2>Time wasted:</h2>
	      	<p id="number">0:00</p>

	      	<div id="progress" role="progressbar" aria-label="Thesis progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="3">
	      		<div id="progress-bar"></div>
	      	</div>
	      	<small id="progress-label">Thesis progress: 3.0%</small>

	        <div class="wrapper">
	        	<div id="btnContainer">
	          	<button id="incButton" tabindex="-1">Increase your wasted time</button>
	            <button id="decButton" class="red" tabindex="-1">Decrease your wasted time</button>
	          </div>
	          <small id="message">Fooled ya! ;)</small>
	      	</div>

	    	</main>
	    </div>

	  	<small class="footer">Made with 💗 by <a href="https://github.com/OliverRomhagen"><div class="img-div"><img src="https://avatars3.githubusercontent.com/u/29176836"></div>Oliver Romhagen</a> & <a href="https://jacobduvander.se"><div class="img-div"><img  src="https://avatars2.githubusercontent.com/u/8696047"></div>Jacob Duvander</a></small>
	</body>
	<script src="script.js"></script>
</html>
